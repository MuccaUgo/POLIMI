<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polimi Interns</title>
<style>
/* Layout: one centred game stage (max 980px) with HUD overlays; modal cards for paperwork. Single dark look, same family as PLGame. */
:root{
  --bg:#1b1b22;  --panel:#26262f; --panel-2:#30303b; --line:#3a3a46;
  --text:#ecebe6; --muted:#9a99a3; --accent:#2a6ad8; --accent-2:#4f8af0;
  --good:#57c05e; --bad:#e05a47; --gold:#f2c14e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text)}
body{font:14px/1.45 var(--mono);padding-inline:16px;padding-block:16px 32px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:30px;letter-spacing:3px}
h2{font-size:18px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button{font:inherit;background:#33333f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:36px}
button:hover{background:#3d3d4b}
button.on,button.primary{background:var(--accent);border-color:var(--accent)}
button.primary:hover{background:var(--accent-2)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;max-width:100%}

/* ---- title ---- */
.title{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
.frame{width:min(560px,100%);border:2px solid var(--line);border-radius:6px;background:#000;padding:4px;box-shadow:0 0 0 1px #000}
.frame canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:256/144}
.sub{color:var(--muted);font-size:12px;text-align:center}
.say{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-height:72px}
.say .cur{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:2px}
.title .acts{width:min(560px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.title .acts button{min-height:44px}

/* ---- creator ---- */
.creator{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px}
@media (max-width:640px){.creator{grid-template-columns:1fr}}
.preview{align-items:center}
.preview canvas{width:168px;height:168px;image-rendering:pixelated;background:linear-gradient(#3c5a3a,#4f7a44);border:2px solid var(--line);border-radius:6px}
.opt{display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;min-height:0;padding:0;border-radius:5px;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
.chip{min-height:30px;padding:3px 10px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.degrees{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px}
.degrees button{text-align:left;display:flex;flex-direction:column;gap:2px;font-size:13px}
.degrees button span{font-size:11px;color:var(--muted)}
.degrees button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.degrees button[aria-pressed="true"] span{color:#dfe8ff}

/* ---- world ---- */
.stage{position:relative;border:2px solid var(--line);border-radius:6px;background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .where{background:rgba(27,27,34,.88);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;min-width:0}
.hud .where b{display:block;font-size:13px}
.hud .btns{display:flex;gap:6px}
.hud .btns button{background:rgba(51,51,63,.92);min-height:32px;font-size:12px;padding:4px 10px}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(27,27,34,.9);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;white-space:nowrap;pointer-events:none}
.kbd{display:inline-block;border:1px solid var(--muted);border-radius:3px;padding:0 4px;margin-right:4px;font-size:11px}
.dialog{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(32,32,40,.97);border:2px solid #57576a;border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;cursor:pointer}
.dialog canvas{width:64px;height:56px;image-rendering:pixelated;background:#3b4c66;border:1px solid var(--line);border-radius:4px}
.dialog .who{color:var(--gold);font-weight:700;font-size:13px}
.dialog .txt{font-size:13px;min-height:54px}
.dialog .more{font-size:11px;color:var(--muted);text-align:right}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.fade.on{opacity:1}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:6px 12px;font-size:12px;max-width:90%;text-align:center}

/* ---- modal paperwork ---- */
.modal{position:fixed;inset:0;background:rgba(10,10,14,.72);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 16px;z-index:10}
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:16px;width:min(860px,100%);display:flex;flex-direction:column;gap:14px;min-width:0}
.card .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent-2)}
.tag{font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.tag.open{background:var(--good);border-color:var(--good);color:#111}
.track{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px}
.path{display:flex;flex-direction:column}
.node{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-block:6px}
.node .dot{width:14px;height:14px;border-radius:3px;background:var(--line);margin-top:3px;justify-self:center}
.node.done .dot{background:var(--good)}
.node.current .dot{background:var(--gold)}
.node .wk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.node.locked .ttl{color:var(--muted)}
.notice{border-left:3px solid var(--gold);padding:8px 12px;background:var(--panel-2);font-size:13px;border-radius:0 6px 6px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cols>*{min-width:0}
.ledger{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
.line .d{font-size:12px;color:var(--muted)}
.line .desc{min-width:0;font-size:12px}
.line .amt{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-size:13px}
.amt.neg{color:var(--bad)} .amt.pos{color:var(--good)}
.line select{grid-column:1/-1;font-size:12px;padding:5px 8px}
.line.fixed{background:transparent}
.line.right{border-color:var(--good)} .line.wrong{border-color:var(--bad)}
.line .why{grid-column:1/-1;font-size:12px}
.total{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:6px 9px;border-top:1px dashed var(--line);font-size:13px}
.score{font-size:34px;font-weight:700;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px}
.stat .num{font-size:24px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.stat .lab{font-size:11px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.badge{display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px;opacity:.45}
.badge.on{opacity:1}
.badge .glyph{grid-row:1/3;width:40px;height:40px;display:grid;place-items:center;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.badge.on .glyph{background:var(--gold);color:#1b1b22;border-color:var(--gold)}
.badge .bname{font-weight:700;font-size:12px}
.badge .bnote{font-size:11px;color:var(--muted)}
.proj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.proj .s{font-size:20px;font-weight:700;color:var(--gold)}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){
  .dialog{position:static;border-width:2px 0 0;border-radius:0;grid-template-columns:48px minmax(0,1fr)}
  .dialog canvas{width:48px;height:42px}
  .hud .where .sub2,.hud .where .prog{display:none}
  .hud .where{padding:4px 8px;font-size:11px;max-width:60%}
  .hud .btns button{padding:3px 8px;min-height:28px;font-size:11px}
  .hint{bottom:auto;top:auto;position:absolute}
}
@media (prefers-reduced-motion:reduce){.fade{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   POLIMI INTERNS — v0.3
   Walkable pixel world (campus + host company) on top of a
   data-driven internship engine. Progress = projects + badges.
   ========================================================= */
const SAVE_KEY = 'polimi-interns-v03';
const T = 16;                         // tile size in pixels
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- CONTENT ---------------- */
const DATA = {
  degrees: [
    { id:'mgmt',   name:'Management Engineering', note:'Numbers and organisations' },
    { id:'comp',   name:'Computer Engineering',   note:'Systems and data' },
    { id:'mech',   name:'Mechanical Engineering', note:'Products and processes' },
    { id:'civil',  name:'Civil Engineering',      note:'Structures and budgets' },
    { id:'arch',   name:'Architecture',           note:'Space and people' },
    { id:'design', name:'Design',                 note:'Users and stories' },
  ],
  badges: [
    { id:'onboarded',  glyph:'ID', name:'Badge in hand',      note:'Finished onboarding at a host company.' },
    { id:'first',      glyph:'1',  name:'First deliverable',  note:'Completed your first project.' },
    { id:'balanced',   glyph:'=',  name:'It balances',        note:'Found the correct reconciled balance.' },
    { id:'sharp',      glyph:'◎',  name:'Sharp eye',          note:'Flagged no difference that was not there.' },
    { id:'clean',      glyph:'✓',  name:'Clean first time',   note:'Scored 100% on the first attempt.' },
    { id:'comeback',   glyph:'↺',  name:'Second time right',  note:'Passed a project after it was sent back.' },
    { id:'letter-afc', glyph:'AFC',name:'Reference letter: AFC', note:'Completed the 12-week AFC internship.' },
  ],
  tracks: [
    { id:'afc', name:'Finance & Control (AFC)', company:'Brera Components S.r.l.', where:'Sesto San Giovanni', open:true,
      note:'Accounting, treasury and controlling in a mid-size manufacturer.' },
    { id:'scm', name:'Supply Chain & Logistics', note:'Planning, purchasing, warehouses.' },
    { id:'swe', name:'Software Engineering',     note:'Tickets, code review, releases.' },
    { id:'pm',  name:'Project Management',       note:'Scope, schedule, stakeholders.' },
    { id:'mkt', name:'Marketing & Sales',        note:'Pricing, campaigns, pipeline.' },
    { id:'hr',  name:'People & HR',              note:'Hiring, payroll, onboarding.' },
  ],
  internships: {
    afc: {
      tutor:'Giulia Ferri', tutorRole:'Senior Controller',
      steps: [
        { id:'onb',     week:'Week 1',    title:'Onboarding in the AFC office', kind:'scene', where:'Talk to Giulia at her desk.' },
        { id:'bankrec', week:'Week 2',    title:'Bank reconciliation, September', kind:'task', where:'Sit at your desk: the file is open on the screen.' },
        { id:'ap',      week:'Week 3',    title:'Supplier invoices: three-way match', kind:'todo' },
        { id:'accr',    week:'Week 4',    title:'Accruals and prepayments', kind:'todo' },
        { id:'close',   week:'Weeks 5–6', title:'Your first month-end close', kind:'todo' },
        { id:'fa',      week:'Week 8',    title:'Fixed assets and depreciation', kind:'todo' },
        { id:'var',     week:'Week 10',   title:'Budget vs actual: variance analysis', kind:'todo' },
        { id:'final',   week:'Week 12',   title:'Final review and reference letter', kind:'todo' },
      ]
    }
  },
  onboarding: [
    "Welcome to Brera Components. We make precision parts for industrial pumps: 140 people, about €38 million in revenue. I'm Giulia, I run controlling. For twelve weeks you sit with the AFC team.",
    "AFC stands for Amministrazione, Finanza e Controllo. Three jobs in one office. Accounting records what happened. Treasury makes sure there is cash to pay people and suppliers. Controlling explains the numbers to management.",
    "Our rhythm is the month-end close. In the first five working days of every month we check that the books are complete and correct, then the CEO gets a report. Almost everything you do here feeds that close.",
    "Your first real job: the bank reconciliation. The bank statement and our books should tell the same story about cash. They never match at first. Find out why, and fix what is ours to fix. Your desk is the one with the screen on."
  ],
  bankrec: {
    month:'September 2026',
    bank:[
      { id:'b0', date:'01/09', desc:'Opening balance', amt:40000, fixed:true },
      { id:'b1', date:'05/09', desc:'Incoming transfer · Rossi S.r.l. inv. 2026/118', amt:12500, ans:'match' },
      { id:'b2', date:'10/09', desc:'Outgoing transfer · Acme Steel S.p.A.', amt:-6200, ans:'match' },
      { id:'b3', date:'15/09', desc:'Account maintenance fees Q3', amt:-45, ans:'record',
        why:'Fees appear only on the statement. The bank already took the money, so the books must catch up: post Bank charges against Bank.' },
      { id:'b4', date:'20/09', desc:'Credit interest', amt:15, ans:'record',
        why:'Interest is credited by the bank and nobody posted it. Record it in the books: Bank against Interest income.' },
      { id:'b5', date:'25/09', desc:'SEPA direct debit · electricity', amt:-1180, ans:'match' },
      { id:'b6', date:'28/09', desc:'Incoming transfer · Verdi & Figli', amt:3300, ans:'match' },
    ],
    ledger:[
      { id:'l0', date:'01/09', desc:'Opening balance', amt:40000, fixed:true },
      { id:'l1', date:'05/09', desc:'Receipt Rossi S.r.l. inv. 2026/118', amt:12500, ans:'match' },
      { id:'l2', date:'10/09', desc:'Payment Acme Steel S.p.A.', amt:-6200, ans:'match' },
      { id:'l3', date:'25/09', desc:'Electricity bill, September', amt:-1180, ans:'match' },
      { id:'l4', date:'28/09', desc:'Receipt Verdi & Figli inv. 2026/131', amt:3300, ans:'dup' },
      { id:'l5', date:'28/09', desc:'Receipt Verdi & Figli inv. 2026/131', amt:3300, ans:'dup' },
      { id:'l6', date:'29/09', desc:'Payment Bianchi Logistica (wire issued)', amt:-2400, ans:'timing',
        why:'The wire left our books on 29/09 but the bank executed it in October. Outstanding payment: subtract it from the bank balance. No entry needed.' },
      { id:'l7', date:'30/09', desc:'Receipt Neri S.p.A. (cheque deposited)', amt:5000, ans:'timing',
        why:'Deposited on the last day, credited by the bank in October. Deposit in transit: add it to the bank balance. No entry needed.' },
    ],
    dupWhy:'The same invoice was posted twice. The bank shows only one receipt from Verdi. Reverse one of the two entries.',
    reconciled:50990,
    options:[
      ['match','Matched on both sides'],
      ['timing','Timing difference: adjust the bank side'],
      ['record','Missing in our books: record an entry'],
      ['error','Error in our books: reverse it'],
    ]
  },
  studentLines: [
    "The Career Service is in Edificio 1, straight up the steps. They post new internships every month.",
    "I did my stage in a bank. First week I only reconciled accounts. Best thing I ever learned, honestly.",
    "Tip: when a tutor sends your work back, read every red note. The second attempt is where you learn.",
    "The tram stop is at the bottom of the piazza. That's how everybody gets to their internship.",
    "Esame di Analisi tomorrow. Don't talk to me.",
    "Have you seen the notice board by the steps? It explains how the internships work.",
  ],
};

/* ---------------- LOOK OPTIONS ---------------- */
const LOOK = {
  skin:  ['#f6d5b8','#ecbf96','#d6a072','#b37b52','#8c5b3a','#5f3d27'],
  hair:  ['#2a1d17','#5a3a22','#8f5f2d','#cfa257','#ead8a0','#a9452d','#8a8f9c','#3d55b8'],
  shirt: ['#2a6ad8','#c94a3f','#3f8f5a','#e0a63a','#7a4fb0','#e9e6dc','#2b2f3a','#d96fa0'],
  pants: ['#2c3e5c','#3a3a42','#6b5136','#5a6575','#8c8f6a'],
  styles:[['short','Short'],['long','Long'],['bun','Bun'],['curly','Curly'],['buzz','Buzz']],
};
const NPC_LOOKS = {
  giulia:{ skin:'#ecbf96', hair:'#2a1d17', hairStyle:'long', shirt:'#2b2f3a', pants:'#2c3e5c', glasses:true },
  luca:  { skin:'#d6a072', hair:'#5a3a22', hairStyle:'short', shirt:'#e9e6dc', pants:'#3a3a42', glasses:false },
  sara:  { skin:'#f6d5b8', hair:'#a9452d', hairStyle:'bun', shirt:'#3f8f5a', pants:'#2c3e5c', glasses:false },
};

/* ---------------- STATE ---------------- */
let state = freshState();
function freshState(){
  return {
    screen:'title',
    draft:{ name:'', degree:'mgmt', look:{ skin:LOOK.skin[1], hair:LOOK.hair[1], hairStyle:'short', shirt:LOOK.shirt[0], pants:LOOK.pants[0], glasses:false } },
    player:null, map:'campus', pos:null,
    accepted:{}, progress:{ afc:{ done:{} } }, badges:{}, projects:[], seen:{},
    task:{ answers:{}, balance:'', result:null, attempts:0 },
  };
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }

/* ---------------- HELPERS ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n<0?'−':'+')+'€'+Math.abs(n).toLocaleString('en-GB');
const fmtBal = n => '€'+n.toLocaleString('en-GB');
const shadeCache = new Map();
function shade(hex, amt){
  const k=hex+amt; if(shadeCache.has(k)) return shadeCache.get(k);
  const n=parseInt(hex.slice(1),16), ch=s=>Math.max(0,Math.min(255,((n>>s)&255)+amt));
  const out='#'+[16,8,0].map(s=>ch(s).toString(16).padStart(2,'0')).join('');
  shadeCache.set(k,out); return out;
}
function hash(x,y,s){ let v=Math.imul(x+101,374761393)^Math.imul(y+59,668265263)^s; v=Math.imul(v^(v>>>13),1274126177); return ((v^(v>>>16))>>>0)/4294967296; }
function award(id){
  if(state.badges[id]) return null;
  state.badges[id]=new Date().toISOString().slice(0,10);
  return DATA.badges.find(b=>b.id===id);
}
function badgeHTML(b,on){ return `<div class="badge ${on?'on':''}" title="${esc(b.note)}"><span class="glyph">${b.glyph}</span><span class="bname">${b.name}</span><span class="bnote">${on?b.note:'Locked'}</span></div>`; }
function stepStatus(track, i){
  const st=DATA.internships[track].steps, done=state.progress[track].done;
  if(done[st[i].id]) return 'done';
  return i===st.findIndex(s=>!done[s.id]) ? 'current' : 'locked';
}
function currentStep(track){ const st=DATA.internships[track].steps; return st.find(s=>!state.progress[track].done[s.id]); }

/* =========================================================
   PIXEL ART: characters
   ========================================================= */
function drawPerson(c, fx, fy, L, facing='down', frame=-1, seated=false){
  const x=Math.round(fx)-6, y=Math.round(fy)-(seated?14:18);
  const p=(dx,dy,w,h,col)=>{ c.fillStyle=col; c.fillRect(x+dx,y+dy,w,h); };
  const dark='#26303d', shoes='#1e2530', H=L.hair, S=L.skin, hs=L.hairStyle;
  p(1,seated?13:17,10,2,'rgba(20,24,30,.25)');
  if(hs==='long' && facing==='down'){ p(2,4,8,7,shade(H,-14)); }
  // hair mass
  if(hs==='buzz'){ p(3,1,6,2,H); p(3,1,6,1,shade(H,16)); }
  else if(hs==='curly'){ p(1,0,10,5,H); p(2,-1,2,1,H); p(5,-1,2,1,H); p(8,-1,2,1,H); p(3,1,1,1,shade(H,28)); p(7,0,1,1,shade(H,28)); p(5,2,1,1,shade(H,20)); }
  else { p(3,0,6,1,shade(H,-12)); p(2,1,8,4,H); p(3,1,5,1,shade(H,22)); }

const MAPS = {};
function getMap(id){ if(!MAPS[id]) MAPS[id] = id==='office' ? buildOffice() : buildCampus(); return MAPS[id]; }

/* =========================================================
   WORLD: runtime
   ========================================================= */
const W = { cv:null, c:null, map:null, cam:{x:0,y:0}, vw:24, vh:15, player:null, npcs:[], keys:new Set(),
  dialog:null, raf:0, last:0, f:0, tram:{x:-200,next:6}, busy:false };

function enterMap(id, at){
  const m = getMap(id);
  W.map = m; state.map = id;
  const sp = at || m.spawn;
  W.player = { tx:sp.x, ty:sp.y, px:sp.x*T, py:sp.y*T, facing:sp.f||'down', moving:false, t:0, from:null, to:null, walk:0, path:[], pending:null };
  if(id==='campus'){
    W.npcs = Array.from({length:6},(_,i)=>{
      const spots=[[5,13],[25,14],[14,12],[17,15],[8,8],[27,8]][i];
      return { id:'stu'+i, tx:spots[0], ty:spots[1], px:spots[0]*T, py:spots[1]*T, facing:'down', look:randomLook(300+i*17), moving:false, t:0, walk:0, wait:1+i*.7, line:i };
    });
  } else {
    W.npcs = (m.npcs||[]).map(n=>({ ...n, tx:n.x, ty:n.y, px:n.x*T, py:n.y*T, moving:false, walk:0, wait:999 }));
  }
  savePos();
}
function savePos(){ if(W.player){ state.pos={x:W.player.tx,y:W.player.ty,f:W.player.facing}; save(); } }

function isBlocked(x,y, ignore){
  const m=W.map; if(x<0||y<0||x>=m.W||y>=m.H) return true;
  if(m.solid[y*m.W+x]) return true;
  for(const n of W.npcs){ if(n===ignore) continue; if((n.tx===x&&n.ty===y)||(n.moving&&n.to&&n.to.x===x&&n.to.y===y)) return true; }
  const p=W.player; if(p && p!==ignore && ((p.tx===x&&p.ty===y)||(p.moving&&p.to.x===x&&p.to.y===y))) return true;
  return false;
}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function startStep(ent, dir){
  ent.facing=dir; const [dx,dy]=DIRS[dir], nx=ent.tx+dx, ny=ent.ty+dy;
  if(isBlocked(nx,ny,ent)) return false;
  ent.moving=true; ent.t=0; ent.from={x:ent.tx,y:ent.ty}; ent.to={x:nx,y:ny}; return true;
}
function stepEntity(ent, dt, speed){
  ent.t += dt/speed; ent.walk += dt/ (speed/2);
  if(ent.t>=1){ ent.tx=ent.to.x; ent.ty=ent.to.y; ent.px=ent.tx*T; ent.py=ent.ty*T; ent.moving=false; return true; }
  ent.px=(ent.from.x+(ent.to.x-ent.from.x)*ent.t)*T; ent.py=(ent.from.y+(ent.to.y-ent.from.y)*ent.t)*T; return false;
}
function bfs(sx,sy,goals){
  const m=W.map, key=(x,y)=>y*m.W+x, prev=new Map([[key(sx,sy),null]]), q=[[sx,sy]];
  const goalSet=new Set(goals.map(([x,y])=>key(x,y)));
  if(goalSet.has(key(sx,sy))) return [];
  while(q.length){
    const [x,y]=q.shift();
    for(const [d,[dx,dy]] of Object.entries(DIRS)){
      const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(prev.has(k)||isBlocked(nx,ny,W.player)) continue;
      prev.set(k,[x,y,d]);
      if(goalSet.has(k)){ const path=[]; let cur=k; while(prev.get(cur)){ const [px,py,dd]=prev.get(cur); path.unshift(dd); cur=key(px,py); } return path; }
      q.push([nx,ny]);
    }
  }
  return null;
}
function targetAt(x,y){
  const n=W.npcs.find(n=>n.tx===x&&n.ty===y); if(n) return {kind:'npc',npc:n,x,y};
  const o=W.map.objects.find(o=>x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h); if(o) return {kind:'obj',obj:o,x,y};
  return null;
}
function facedTarget(){
  const p=W.player, [dx,dy]=DIRS[p.facing]; return targetAt(p.tx+dx,p.ty+dy);
}
function tapTile(tx,ty){
  const p=W.player; if(!p||W.dialog||W.busy) return;
  const t=targetAt(tx,ty);
  if(t){
    const cells = t.kind==='npc' ? [[tx,ty]] : (()=>{ const o=t.obj, out=[]; for(let j=o.y;j<o.y+o.h;j++) for(let i=o.x;i<o.x+o.w;i++) out.push([i,j]); return out; })();
    const goals=[]; cells.forEach(([cx,cy])=>Object.values(DIRS).forEach(([dx,dy])=>{ const gx=cx+dx, gy=cy+dy; if(!isBlocked(gx,gy,W.player)||(gx===p.tx&&gy===p.ty)) goals.push([gx,gy]); }));
    const path=bfs(p.tx,p.ty,goals);
    if(path){ p.path=path; p.pending={x:tx,y:ty,t}; }
  } else {
    const path=bfs(p.tx,p.ty,[[tx,ty]]); if(path){ p.path=path; p.pending=null; }
  }
}
function faceToward(x,y){ const p=W.player, dx=x-p.tx, dy=y-p.ty;
  p.facing = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'); }

function update(dt){
  const p=W.player; if(!p) return;
  if(!W.dialog && !W.busy){
    if(p.moving){ if(stepEntity(p,dt,.17)){ if(!p.path.length && !p.pending) savePos(); } }
    if(!p.moving){
      const held=['up','down','left','right'].find(d=>W.keys.has(d));
      if(held){ p.path=[]; p.pending=null; if(!startStep(p,held)) {} }
      else if(p.path.length){ const d=p.path.shift(); if(!startStep(p,d)){ p.path=[]; } }
      else if(p.pending){
        const pend=p.pending; p.pending=null;
        const o=pend.t.kind==='obj'?pend.t.obj:null;
        // face the nearest cell of the target
        let best=[pend.x,pend.y];
        if(o){ let bd=1e9; for(let j=o.y;j<o.y+o.h;j++) for(let i=o.x;i<o.x+o.w;i++){ const d=Math.abs(i-p.tx)+Math.abs(j-p.ty); if(d<bd){bd=d;best=[i,j];} } }
        faceToward(best[0],best[1]); interact(targetAt(best[0],best[1]));
        savePos();
      }
    }
  }
  // NPC wandering (campus students only)
  for(const n of W.npcs){
    if(n.seated) continue;
    if(n.moving){ stepEntity(n,dt,.32); continue; }
    n.wait-=dt; if(n.wait>0 || W.dialog) continue;
    const dirs=Object.keys(DIRS), d=dirs[Math.floor(Math.random()*4)];
    const [dx,dy]=DIRS[d], ny=n.ty+dy;
    if(ny<7||ny>17){ n.facing=d; n.wait=.6; continue; }
    startStep(n,d); n.wait = Math.random()<.3 ? 1.5+Math.random()*2.5 : .1;
  }
  // tram (campus decoration)
  if(state.map==='campus' && !reduced){
    const tr=W.tram;
    if(tr.x>-200){ tr.x += dt*55; if(tr.x>W.map.W*T+40){ tr.x=-200; tr.next=12+Math.random()*12; } }
    else { tr.next-=dt; if(tr.next<=0) tr.x=-140; }
  }
}

function render(){
  const {c,cv,map:m,player:p}=W; if(!c||!m) return;
  const vw=W.vw*T, vh=W.vh*T, mw=m.W*T, mh=m.H*T;
  let cx = mw<=vw ? -(vw-mw)/2 : Math.max(0,Math.min(mw-vw, p.px+8-vw/2));
  let cy = mh<=vh ? -(vh-mh)/2 : Math.max(0,Math.min(mh-vh, p.py+8-vh/2));
  cx=Math.round(cx); cy=Math.round(cy); W.cam={x:cx,y:cy};
  c.fillStyle='#14141a'; c.fillRect(0,0,vw,vh);
  c.drawImage(m.cv,-cx,-cy);
  // tram
  if(state.map==='campus' && W.tram.x>-200){
    const x=Math.round(W.tram.x)-cx, y=20*T-12-cy;
    c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(x+2,y+28,130,4);
    c.fillStyle='#e8a33c'; c.fillRect(x,y,130,28); c.fillStyle='#f2c14e'; c.fillRect(x,y,130,4);
    c.fillStyle='#3b4a5e'; for(let k=0;k<8;k++) c.fillRect(x+6+k*15,y+7,10,9);
    c.fillStyle='#fffaf0'; c.fillRect(x,y+19,130,2); c.fillStyle='#2b2f3a'; c.fillRect(x+60,y-6,10,6);
  }
  // quest markers
  const mark=questMarker();
  // entities sorted by y
  const ents=[...W.npcs, p].sort((a,b)=>a.py-b.py);
  for(const e of ents){
    const fr = e.moving ? Math.floor(e.walk)%4 : -1;
    drawPerson(c, e.px+8-cx, e.py+16-cy, e===p?state.player.look:e.look, e.facing, fr, !!e.seated);
  }
  if(mark){
    const bob = reduced?0:Math.round(Math.sin(W.f/6)*1.5);
    const x=mark.x*T+8-cx, y=mark.y*T-14-cy+bob;
    c.fillStyle='#1b1b22'; c.fillRect(x-4,y-1,8,12); c.fillStyle='#f2c14e'; c.fillRect(x-3,y,6,10); c.fillStyle='#1b1b22'; c.fillRect(x-1,y+1,2,5); c.fillRect(x-1,y+7,2,2);
  }
  // hint
  const hintEl=$('#hint');
  if(hintEl){
    const t=(!W.dialog && !p.moving && !p.path.length) ? facedTarget() : null;
    const label = t ? (t.kind==='npc' ? (t.npc.id.startsWith('stu')?'Talk to the student':`Talk to ${cap(t.npc.id)}`) : t.obj.label) : null;
    hintEl.hidden=!label;
    if(label) hintEl.innerHTML=`<span class="kbd">E</span>${esc(label)}`;
  }
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function questMarker(){
  if(state.map==='campus'){
    if(!state.accepted.afc) return {x:15.5,y:5.2};
    return {x:25.5,y:18};
  }
  const st=currentStep('afc'); if(!st) return null;
  if(st.id==='onb') return {x:3.5,y:2.6};
  if(st.id==='bankrec') return {x:8.5,y:7.4};
  return null;
}

function loop(t){
  const dt=Math.min(.05,(t-(W.last||t))/1000); W.last=t; W.f++;
  update(dt); render();
  W.raf=requestAnimationFrame(loop);
}

/* ---------------- interactions ---------------- */
function interact(t){
  if(!t) return;
  if(t.kind==='npc'){
    const n=t.npc; n.facing = oppositeFacing(W.player.facing);
    if(n.id.startsWith('stu')) return say([{who:'Student', look:n.look, text:DATA.studentLines[n.line%DATA.studentLines.length]}]);
    return talkTo(n.id);
  }
  const id=t.obj.id;
  if(id.startsWith('npc-')) return talkTo(id.slice(4));
  ({
    career: ()=>openCareer(),
    board: ()=>openHow(),
    tram: ()=>{
      if(!state.accepted.afc) return say([{who:'Tram stop', text:"Trams to everywhere in Milan. You have nowhere to be yet: the Career Service in Edificio 1 has the internships."}]);
      travel('office');
    },
    exit: ()=>travel('campus'),
    desk: ()=>{
      const st=currentStep('afc');
      if(!state.progress.afc.done.onb) return say([{who:'Your desk', text:"A clean desk, a dual screen, a badge that doesn't work yet. Say hello to Giulia first."}]);
      if(st && st.id==='bankrec') return openTask();
      return say([{who:'Your desk', text:"The September reconciliation is filed. Next week's work is not on the screen yet: it arrives in the next build."}]);
    },
    olddesk: ()=>say([{who:'Empty desk', text:"Last year's intern sat here. A post-it on the monitor says: \"ALWAYS check for duplicates before you post anything.\""}]),
    whiteboard: ()=>say([{who:'Whiteboard', text:"MONTH-END CLOSE. WD1: bank recs and cut-off. WD2: accruals. WD3: intercompany. WD4: review. WD5: report to the CEO. WD means working day."}]),

    coffee: ()=>say([{who:'Coffee machine', text:"€0.50 an espresso. The only number in this office nobody reconciles."}]),
  })[id]?.();
}
function oppositeFacing(f){ return {up:'down',down:'up',left:'right',right:'left'}[f]; }
function talkTo(id){

function say(lines, onEnd){
  W.dialog={lines, i:0, onEnd, shown:0, timer:null};

function drawDialog(){
  const box=$('#dialog'); const d=W.dialog;
  if(!d){ box.hidden=true; return; }
  const ln=d.lines[d.i]; box.hidden=false;
  box.innerHTML=`${ln.look?'<canvas width="16" height="14" id="pt"></canvas>':'<canvas width="16" height="14" id="pt"></canvas>'}
    <div class="stack" style="gap:4px"><div class="who">${esc(ln.who)}</div><div class="txt" id="dtxt"></div>
    <div class="more">${d.i<d.lines.length-1?'Next ▸':'Close ▸'} · ${d.i+1}/${d.lines.length}</div></div>`;
  const pt=$('#pt');
  if(ln.look) drawPortrait(pt, ln.look);
  else { const c=pt.getContext('2d'); c.fillStyle='#3b4c66'; c.fillRect(0,0,16,14); c.fillStyle='#f2c14e'; c.fillRect(7,3,2,6); c.fillRect(7,10,2,2); }
  clearInterval(d.timer); d.shown=0;
  const el=$('#dtxt');
  if(reduced){ d.shown=ln.text.length; el.textContent=ln.text; return; }
  d.timer=setInterval(()=>{ d.shown=Math.min(ln.text.length,d.shown+2); el.textContent=ln.text.slice(0,d.shown); if(d.shown>=ln.text.length) clearInterval(d.timer); },22);
}
function advanceDialog(){
  const d=W.dialog; if(!d) return;
  const ln=d.lines[d.i];
  if(d.shown<ln.text.length){ clearInterval(d.timer); d.shown=ln.text.length; $('#dtxt').textContent=ln.text; return; }
  d.i++;
  if(d.i>=d.lines.length){ clearInterval(d.timer); const cb=d.onEnd; W.dialog=null; drawDialog(); updateWhere(); cb&&cb(); updateWhere(); return; }
  drawDialog();
}
function toast(msg){

/* ---------- bank reconciliation project ---------- */
function openTask(){
  const T2=DATA.bankrec, r=state.task.result, sum=l=>l.reduce((a,x)=>a+x.amt,0);
  const opt=id=>`<select id="sel-${id}" data-line="${id}" ${r?'disabled':''}>${T2.options.map(([v,l])=>`<option value="${v}" ${(state.task.answers[id]||'match')===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const line=l=>{ const res=r&&r.lines[l.id];
    return `<div class="line ${l.fixed?'fixed':''} ${res?(res.ok?'right':'wrong'):''}"><span class="d">${l.date}</span><span class="desc">${l.desc}</span>
      <span class="amt ${l.fixed?'':(l.amt<0?'neg':'pos')}">${l.fixed?fmtBal(l.amt):fmt(l.amt)}</span>${l.fixed?'':opt(l.id)}
      ${res&&res.why?`<div class="why">${res.ok?'✓':'✗'} ${res.why}</div>`:''}</div>`; };
  openModal(`
    <div class="head"><div><div class="eyebrow">Week 2 · Project</div><h2>Bank reconciliation, ${T2.month}</h2></div>${closeBtn}</div>
    <p>"Here is the September statement from the bank and our cash ledger. They close on different balances. Go through every line, tell me why each difference exists, then give me the true cash balance at 30 September." <span class="muted">— Giulia</span></p>
    <div class="notice">For every line choose one: matched on both sides, a <b>timing difference</b> (it clears next month, adjust the bank side), <b>missing in our books</b> (record it), or an <b>error in our books</b> (reverse it).</div>
    <div class="cols">
      <div class="stack"><h3>Bank statement</h3><div class="ledger">${T2.bank.map(line).join('')}</div><div class="total"><span>Closing 30/09</span><span>${fmtBal(sum(T2.bank))}</span></div></div>
      <div class="stack"><h3>Cash ledger (our books)</h3><div class="ledger">${T2.ledger.map(line).join('')}</div><div class="total"><span>Closing 30/09</span><span>${fmtBal(sum(T2.ledger))}</span></div></div>
    </div>
    ${r?resultHTML(r):`<div class="stack"><label class="stack" style="gap:6px" for="bal"><h3>Reconciled cash balance at 30/09 (€)</h3></label>
      <input id="bal" inputmode="numeric" value="${esc(state.task.balance)}" placeholder="e.g. 48390">
      <div class="row"><button class="primary" id="submit">Hand it to Giulia</button><button data-close>Leave for now</button></div></div>`}`,
    root=>{
      root.querySelectorAll('select[data-line]').forEach(s=>s.onchange=()=>{ state.task.answers[s.dataset.line]=s.value; save(); });
      const bal=root.querySelector('#bal'); if(bal) bal.oninput=()=>{ state.task.balance=bal.value; save(); };
      root.querySelector('#submit')?.addEventListener('click',submitTask);
      root.querySelector('#retry')?.addEventListener('click',()=>{ state.task.result=null; save(); openTask(); });
      if(r) root.querySelector('.score')?.scrollIntoView({block:'center'});
    });
}
function resultHTML(r){
  const passed=r.score>=60;
  return `<div class="box"><div class="eyebrow">Giulia's review</div>
    <div class="row" style="align-items:baseline"><span class="score">${r.score}%</span><span>${passed?'Accepted':'Sent back'}</span></div>
    <p>${r.comment}</p>
    <p class="small">Your balance: <b>${r.balanceGiven===null?'none':fmtBal(r.balanceGiven)}</b> · correct: <b>${fmtBal(DATA.bankrec.reconciled)}</b>.
      Bank €48,390 + deposit in transit €5,000 − outstanding payment €2,400 = €50,990. Books €54,320 − fees €45 + interest €15 − duplicate €3,300 = €50,990.</p>
    ${r.newBadges&&r.newBadges.length?`<h3>New badge${r.newBadges.length>1?'s':''}</h3><div class="badges">${r.newBadges.map(id=>badgeHTML(DATA.badges.find(b=>b.id===id),true)).join('')}</div>`:''}
    <div class="row">${passed?`<button class="primary" data-close>Back to the office</button>`:`<button class="primary" id="retry">Redo the reconciliation</button><button data-close>Leave for now</button>`}</div></div>`;
}
function gradeBankRec(answers, balanceStr){
  const T2=DATA.bankrec, lines={}; let correct=0,total=0,falsePos=0;
  for(const l of [...T2.bank,...T2.ledger].filter(l=>!l.fixed&&l.ans!=='dup')){
    total++; const a=answers[l.id]||'match', ok=a===l.ans;
    if(ok) correct++; if(!ok&&l.ans==='match') falsePos++;
    lines[l.id]={ok, why: ok?(l.why||null):(l.why||'This line appears on both sides with the same amount. It is matched.')};
  }
  total++;
  const a4=answers.l4||'match', a5=answers.l5||'match', dupOk=(a4==='error'&&a5==='match')||(a4==='match'&&a5==='error');
  if(dupOk) correct++;
  lines.l4={ok:dupOk, why:(!dupOk||a4!=='match')?T2.dupWhy:null};
  lines.l5={ok:dupOk, why:(!dupOk||a5!=='match')?T2.dupWhy:null};
  if(dupOk){ if(a4==='match') lines.l4.why=null; else lines.l5.why=null; }
  const digits=String(balanceStr).replace(/[^\d-]/g,''), balanceGiven=digits?parseInt(digits,10):null, balOk=balanceGiven===T2.reconciled;
  return { lines, correct, total, falsePos, balOk, balanceGiven, score:Math.round((correct/total)*80+(balOk?20:0)) };
}
function submitTask(){
  state.task.attempts=(state.task.attempts||0)+1;
  const g=gradeBankRec(state.task.answers,state.task.balance), passed=g.score>=60, newBadges=[];
  const earn=id=>{ if(award(id)) newBadges.push(id); };
  if(g.balOk) earn('balanced');
  if(g.falsePos===0) earn('sharp');
  if(passed){
    state.progress.afc.done.bankrec=true;
    const prev=state.projects.find(p=>p.id==='bankrec');
    const rec={id:'bankrec',title:'Bank reconciliation, September 2026',company:'Brera Components S.r.l.',track:'AFC',score:g.score,attempts:state.task.attempts,date:new Date().toISOString().slice(0,10)};
    if(!prev) state.projects.push(rec); else if(g.score>prev.score) Object.assign(prev,rec);
    earn('first'); if(g.score===100&&state.task.attempts===1) earn('clean'); if(state.task.attempts>1) earn('comeback');
  }
  const comment = g.score===100 ? '"Clean. Post the fees, the interest and the reversal, and file this. Next week is purchasing."'
    : passed ? `"Good enough to file, but check the lines in red before you post anything.${g.falsePos?' You flagged differences that were not there: that creates entries nobody needs.':''}"`
    : `"This does not reconcile. ${!g.balOk?'Start from the closing balances and ask, line by line, which side is behind. ':''}Read the notes in red and try again."`;
  state.task.result={...g,comment,newBadges}; save(); openTask();
}

  const w=$('#stage').clientWidth;
  W.vw = w<520 ? 14 : w<760 ? 19 : 24; W.vh = 15;
  W.cv.width=W.vw*T; W.cv.height=W.vh*T; W.c.imageSmoothingEnabled=false;
}
function updateWhere(){
  const el=$('#where'); if(!el||!W.map) return;
  const st=currentStep('afc');
  let next='Go to the Career Service in Edificio 1.';
  if(state.accepted.afc){
    if(state.map==='campus') next='Take the tram to Brera Components.';
    else if(st&&st.where) next=st.where;
    else next='Week 3 arrives in the next build.';
  }
  el.innerHTML=`<b>${W.map.name}</b><span class="muted sub2">${W.map.sub}<br></span><span style="color:var(--gold)">▸ ${esc(next)}</span>
    <span class="muted prog"><br>${state.projects.length} project${state.projects.length===1?'':'s'} · ${Object.keys(state.badges).length}/${DATA.badges.length} badges</span>`;
}

/* ---------------- input ---------------- */
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(state.screen!=='world'||!W.cv) return;
  if(e.target.matches('input,select,textarea')) return;
  if(W.busy){ if(e.key==='Escape') closeModal(); return; }
  const k=KEYMAP[e.code];
  if(W.dialog){ if(['Space','Enter','KeyE'].includes(e.code)){ e.preventDefault(); if(!e.repeat) advanceDialog(); } else if(k) e.preventDefault(); return; }
  if(k){ e.preventDefault(); W.keys.add(k); return; }
  if(['Space','Enter','KeyE'].includes(e.code)){ e.preventDefault(); if(!W.player.moving) interact(facedTarget()); }
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) W.keys.delete(k); });
addEventListener('blur',()=>W.keys.clear());
addEventListener('resize',()=>{ if(W.cv) sizeStage(); });

/* ---------------- boot ---------------- */
function start(data){
  if(data&&data.state) state=data.state; else { const s=load(); if(s) state=s; }
  window.claude?.hot?.snapshot?.(()=>{ savePos(); return {state}; });
  if(state.screen==='world'&&state.player) showWorld();
  else if(state.screen==='create') showCreate();
  else { state.screen='title'; showTitle(); }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

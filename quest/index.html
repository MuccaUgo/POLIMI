<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>PolimiAFC</title>
<meta name="description" content="PolimiAFC: a pixel-art accounting career at PolimiAFC S.p.A., from intern to partner, with consolidation and financial analysis desks and mock exams for the AFC course." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="theme-color" content="#1c1a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="PolimiAFC" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="console">
  <div id="hud">
    <span id="hudPlace">PolimiAFC</span>
    <span id="hudStats"></span>
  </div>
  <div id="screen">
    <canvas id="cv" width="160" height="144" aria-label="Game world"></canvas>
    <div id="dialog" class="box" hidden>
      <div id="dlgName"></div>
      <div id="dlgText"></div>
      <div id="dlgChoices"></div>
      <span id="dlgMore" aria-hidden="true">▼</span>
    </div>
    <div id="task" hidden></div>
    <div id="fade"></div>
  </div>
  <div id="pad">
    <div id="todo" aria-label="Where the work is"></div>
    <div class="pills">
      <button id="btnSound" class="pill">SOUND</button>
      <button id="btnMenu" class="pill">MENU</button>
      <button id="btnUpdate" class="pill" aria-label="Update the game to the latest version">⟳ UPDATE</button>
    </div>
  </div>
</div>

<div id="overlay" hidden></div>

<script src="art.js"></script>
<script src="office-art.js"></script>
<script src="world.js"></script>
<script src="logic.js"></script>
<script src="office-data.js"></script>
<script src="office-logic.js"></script>
<script src="office-analysis.js"></script>
<script src="office-study.js"></script>
<script src="office-exam.js"></script>
<script src="office-planning.js"></script>
<script src="office-ui.js"></script>
<script src="backup.js"></script>
<script src="game.js"></script>
</body>
</html>
